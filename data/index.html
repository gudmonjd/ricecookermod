<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Rice Cooker Mod</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="topnav">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e5e7eb" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;">
        <!-- Lid -->
        <rect x="5" y="3" width="14" height="4" rx="2" ry="2" />
        <!-- Handle -->
        <line x1="9" y1="3" x2="15" y2="3" />
        <!-- Body -->
        <rect x="3" y="7" width="18" height="12" rx="3" ry="3" />
        <!-- Front button -->
        <circle cx="12" cy="13" r="2" />
      </svg>
      Rice Cooker Mod
    </h1>
  </div>

  <div class="content">

    <div class="card-grid">

      <!-- TEMPERATURE -->
      <div class="card">
        <h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
            <path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0Z" />
          </svg>
          Temperature
        </h2>
        <div class="row">
          <div class="label">Current:</div>
          <div class="value"><span id="currentTemp">--</span> °C</div>
        </div>
        <div class="row">
          <div class="label">Target:</div>
          <div class="value"><span id="targetTempDisplay">--</span> °C</div>
        </div>
        <div class="slider-row">
          <input type="range" id="targetTempSlider" min="20" max="110" step="1">
        </div>
      </div>

      <!-- BURNER -->
      <div class="card">
        <h2>
          <svg id="burnerIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
            <path d="M12 2C8 7 8 11 12 22C16 11 16 7 12 2Z" />
          </svg>
          Burner
        </h2>

        <div class="row">
          <div class="label">PWM:</div>
          <div class="value"><span id="pwmValue">--</span> %</div>
        </div>
        <div class="row">
          <div class="label">PWM limit:</div>
          <div class="value"><span id="pwmLimitDisplay">--</span> %</div>
        </div>
        <div class="slider-row">
          <input type="range" id="pwmLimitSlider" min="0" max="100" step="1">
        </div>
        <div class="row">
          <div class="label">Burner:</div>
          <div class="value">
            <span id="relayStateBadge" class="badge badge-off">OFF</span>
          </div>
        </div>
      </div>

      <!-- TIMER -->
      <div class="card">
        <h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
            <path d="M6 2h12v4l-4 4 4 4v4H6v-4l4-4-4-4V2z" />
          </svg>
          Timer
        </h2>
        <div class="row">
          <div class="label">Turn off in:</div>
          <div class="value">
            <span id="turnOffCountdown">--:--:--</span>
            <span class="small">(<span id="turnOffAbsolute">--:--</span>)</span>
          </div>
        </div>

        <div class="row">
          <div class="label">Set duration:</div>
          <div class="value">
            <select id="hoursSelect">
              <option value="0">0 h</option>
              <option value="1">1 h</option>
              <option value="2">2 h</option>
              <option value="3">3 h</option>
              <option value="4">4 h</option>
              <option value="5">5 h</option>
              <option value="6">6 h</option>
              <option value="7">7 h</option>
              <option value="8">8 h</option>
              <option value="9">9 h</option>
              <option value="10">10 h</option>
              <option value="11">11 h</option>
              <option value="12">12 h</option>
            </select>
            <select id="minutesSelect">
              <option value="0">0 min</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
            </select>
          </div>
        </div>

        <div class="row">
          <button id="setTimerBtn">Set countdown</button>
        </div>
      </div>

      <!-- STATS -->
      <div class="card">
        <h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
            <path d="M3 3v18h18" />
            <path d="M7 14l3-3 2 2 5-5" />
          </svg>
          Stats
        </h2>
        <div class="row">
          <div class="label">Elapsed time:</div>
          <div class="value"><span id="elapsedTime">--:--:--</span></div>
        </div>
        <div class="row">
          <div class="label">Relay ON total:</div>
          <div class="value"><span id="totalOnTime">--</span> s</div>
        </div>
      </div>

      <!-- GRAPH -->
      <div class="card graph-card">
        <h2>
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
            <polyline points="3 17 9 11 13 15 21 7" />
            <path d="M21 17V7H11" />
          </svg>
          Graph
        </h2>
        <canvas id="tempGraph"></canvas>
      </div>


    </div>
  </div>
  
  <script>
    let chartJsAvailable = typeof Chart !== "undefined";
  </script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js");
    }
  </script>

</body>

</html>
